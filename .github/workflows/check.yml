name: Kontrollera Lindas Revolt
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Kontrollera JavaScript
        run: |
          node --check js/program.js
          node --check js/storage.js
          node --check js/app.js
          node --check sw.js
      - name: Kör tester
        run: node --test tests/app.test.cjs
