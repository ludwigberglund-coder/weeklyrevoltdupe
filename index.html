<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9ebed">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Lindas dagliga träningsstund. Små steg, stor skillnad – en dag i taget.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lindas Revolt">
  <title>Lindas Revolt – en dag i taget</title>
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./js/program.js"></script>
  <script defer src="./js/storage.js"></script>
  <script defer src="./js/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="brand-row">
        <button class="brand" type="button" data-action="home" aria-label="Till startsidan">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 36 36" fill="none"><path d="M18 3v30M3 18h30M7.4 7.4l21.2 21.2M28.6 7.4 7.4 28.6" stroke="currentColor" stroke-width="3.7" stroke-linecap="round"/></svg>
          </span>
          <span class="brand-label">lindas<span>revolt</span><i>.</i></span>
        </button>
        <button class="icon-button share-button" type="button" data-action="share" aria-label="Dela webbplatsen" title="Dela">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m0 0L7 8m5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
        </button>
      </div>
      <div class="heading-area">
        <p class="eyebrow"><span class="eyebrow-dot"></span> DIN STUND VARJE DAG</p>
        <h1 id="page-heading">Hej Linda! <span class="heading-flower" aria-hidden="true">✳</span></h1>
        <p id="page-subtitle">Små steg. Stor skillnad.</p>
      </div>
    </header>

    <main id="main-view" class="main-view" tabindex="-1" aria-live="off">
      <div class="initial-loading">Gör plats för dagens lilla stund …</div>
    </main>

    <nav class="bottom-nav" aria-label="Huvudnavigering">
      <button type="button" class="nav-item is-active" data-tab="today" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Idag</span>
      </button>
      <button type="button" class="nav-item" data-tab="program">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4m8-4v4M3 10h18m-13 5h2m4 0h2"/></svg><span>Veckor</span>
      </button>
      <button type="button" class="nav-item" data-tab="progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M6 18V9m6 9V4m6 14v-7"/><path d="m5 5 3-2 4 3 5-4"/></svg><span>Framsteg</span>
      </button>
      <button type="button" class="nav-item" data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l-1.9 1.9a1.6 1.6 0 0 0-1.8-.3l-.9.4a1.6 1.6 0 0 0-1 1.5V21h-2.8v-.7a1.6 1.6 0 0 0-1-1.5l-.9-.4a1.6 1.6 0 0 0-1.8.3l-1.9-1.9A1.6 1.6 0 0 0 6 15l-.4-.9a1.6 1.6 0 0 0-1.5-1H3v-2.8h1.1a1.6 1.6 0 0 0 1.5-1L6 8.4a1.6 1.6 0 0 0-.3-1.8l1.9-1.9a1.6 1.6 0 0 0 1.8.3l.9-.4a1.6 1.6 0 0 0 1-1.5V3h2.8v.1a1.6 1.6 0 0 0 1 1.5l.9.4a1.6 1.6 0 0 0 1.8-.3l1.9 1.9a1.6 1.6 0 0 0-.3 1.8l.4.9a1.6 1.6 0 0 0 1.5 1H21v2.8h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg><span>Mer</span>
      </button>
    </nav>
  </div>

  <dialog class="exercise-dialog" id="exercise-dialog" aria-label="Övningsguide">
    <button type="button" class="dialog-close" data-action="close-dialog" aria-label="Stäng">×</button>
    <div id="dialog-body"></div>
  </dialog>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><div class="no-script">Aktivera JavaScript för att kunna använda Lindas Revolt.</div></noscript>
</body>
</html>
